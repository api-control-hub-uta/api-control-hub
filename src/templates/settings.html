<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Smart Closet</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b0f14;
            color: white;
            overflow-x: hidden;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: #111827;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #60a5fa;
        }

        .container {
            max-width: 850px;
            margin: 40px auto;
            padding: 20px;
        }

        .settings-box {
            background: rgba(31, 41, 55, 0.9);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 10px 28px rgba(0,0,0,0.35);
        }

        h1 {
            margin: 0 0 8px;
            color: #ffffff;
            font-size: 40px;
        }

        .subtitle {
            margin: 0 0 20px;
            color: #cbd5e1;
            font-size: 16px;
        }

        .section {
            background: rgba(17, 24, 39, 0.72);
            border: 1px solid #374151;
            border-radius: 14px;
            padding: 18px;
            margin-top: 16px;
        }

        h2 {
            color: #60a5fa;
            margin: 0 0 12px;
            font-size: 22px;
        }

        label {
            display: block;
            margin: 12px 0 6px;
            font-size: 15px;
            font-weight: 600;
            color: #d1d5db;
            letter-spacing: 0.2px;
        }

        input,
        select {
            width: 100%;
            min-height: 46px;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #374151;
            background: #111827;
            color: white;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
        }

        .led-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        .button-row {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .save-btn,
        .back-btn {
            min-height: 46px;
            padding: 12px 18px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
            border: none;
            font-size: 15px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .save-btn {
            background: #2563eb;
            color: white;
        }

        .back-btn {
            background: #1f2937;
            color: white;
            border: 1px solid #374151;
        }
        .theme-options {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-top: 8px;
}

.theme-option {
    margin: 0;
    min-height: 50px;
    padding: 12px;
    border: 1px solid #374151;
    border-radius: 10px;
    background: #111827;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    cursor: pointer;
    touch-action: manipulation;
}

.theme-option input {
    width: 20px;
    height: 20px;
    min-height: auto;
    margin: 0;
}

.theme-option span {
    font-size: 15px;
    font-weight: bold;
}

.theme-option:has(input:checked) {
    border-color: #3b82f6;
    background: #1d4ed8;
    color: white;
}

body.light .theme-option {
    background: white;
    color: #111827;
    border-color: #d1d5db;
}

body.light .theme-option:has(input:checked) {
    background: #2563eb;
    color: white;
    border-color: #2563eb;
}

        /* ===== LIGHT MODE ===== */
        body.light {
            background: #f3f4f6;
            color: #111827;
        }

        body.light .topbar {
            background: rgba(255, 255, 255, 0.94);
            border-bottom: 1px solid rgba(0,0,0,0.08);
        }

        body.light .logo,
        body.light h2 {
            color: #2563eb;
        }

        body.light .settings-box {
            background: rgba(255, 255, 255, 0.97);
            color: #111827;
            border: 1px solid rgba(0,0,0,0.08);
            box-shadow: 0 10px 28px rgba(0,0,0,0.12);
        }

        body.light .section {
            background: #f9fafb;
            border-color: #d1d5db;
        }

        body.light h1 {
            color: #111827;
        }

        body.light .subtitle,
        body.light label {
            color: #374151;
        }

        body.light input,
        body.light select {
            background: #ffffff;
            color: #111827;
            border: 1px solid #d1d5db;
        }

        body.light .back-btn {
            background: #e5e7eb;
            color: #111827;
            border: 1px solid #9ca3af;
        }

        body.light .save-btn {
            background: #2563eb;
            color: white;
        }

        /* Raspberry Pi 7-inch touchscreen: 800x480 */
        @media screen and (max-width: 850px) {
            body {
                min-height: 100vh;
            }

            .topbar {
                position: sticky;
                top: 0;
                z-index: 100;
                padding: 8px 12px;
            }

            .logo {
                font-size: 21px;
            }

            .container {
                width: 100%;
                max-width: 100%;
                margin: 0;
                padding: 8px;
            }

            .settings-box {
                padding: 12px;
                border-radius: 12px;
            }

            h1 {
                font-size: 27px;
                line-height: 1.05;
                margin-bottom: 3px;
            }

            .subtitle {
                font-size: 12px;
                line-height: 1.3;
                margin-bottom: 8px;
            }

            .section {
                padding: 10px;
                margin-top: 8px;
                border-radius: 10px;
            }
            

            h2 {
                font-size: 16px;
                margin-bottom: 6px;
            }

            label {
                margin: 7px 0 4px;
                font-size: 12px;
            }

            input,
            select {
                min-height: 42px;
                padding: 9px 11px;
                font-size: 14px;
                border-radius: 9px;
            }

            .led-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }

            .button-row {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
                margin-top: 40px;
            }

            .save-btn,
            .back-btn {
                width: 100%;
                min-height: 44px;
                padding: 9px 8px;
                font-size: 13px;
                text-align: center;
            }
        }

        @media screen and (max-width: 600px) {
            .led-grid,
            .button-row {
                grid-template-columns: 1fr;
            }
            .theme-section {
    padding-bottom: 12px;
}

.theme-options {
    gap: 8px;
}

.theme-option {
    min-height: 44px;
    padding: 8px;
}

.button-row {
    margin-top: 16px;
}
        }
    </style>
</head>

<body class="{{ settings[6] }}">
    <div class="topbar">
        <div class="logo">Smart Closet</div>
    </div>

    <div class="container">
        <div class="settings-box">
            <h1>Settings</h1>
            <p class="subtitle">Customize Smart Closet for {{ profile[1] }}</p>

            <form method="post" action="/settings/{{ profile[0] }}">
                <div class="section">
                    <h2>Location</h2>

                    <label for="location">City, State, Country Code</label>
                    <input
                        type="text"
                        id="location"
                        name="location"
                        value="{{ settings[0] }}"
                        placeholder="Arlington,TX,US"
                        autocomplete="off"
                        autocapitalize="off"
                        spellcheck="false"
                    >
                </div>

                <div class="section">
                    <h2>Temperature Units</h2>

                    <label for="temperature_unit">Units</label>
                    <select id="temperature_unit" name="temperature_unit">
                        <option value="fahrenheit" {% if settings[1] == 'fahrenheit' %}selected{% endif %}>Fahrenheit</option>
                        <option value="celsius" {% if settings[1] == 'celsius' %}selected{% endif %}>Celsius</option>
                    </select>
                </div>

                <div class="section">
                    <h2>LED Preferences</h2>

                    <div class="led-grid">
                        <div>
                            <label for="led_hot_color">Hot Weather</label>
                            <select id="led_hot_color" name="led_hot_color">
                                <option value="red" {% if settings[2] == 'red' %}selected{% endif %}>Red</option>
                                <option value="orange" {% if settings[2] == 'orange' %}selected{% endif %}>Orange</option>
                                <option value="yellow" {% if settings[2] == 'yellow' %}selected{% endif %}>Yellow</option>
                                <option value="green" {% if settings[2] == 'green' %}selected{% endif %}>Green</option>
                                <option value="blue" {% if settings[2] == 'blue' %}selected{% endif %}>Blue</option>
                                <option value="purple" {% if settings[2] == 'purple' %}selected{% endif %}>Purple</option>
                            </select>
                        </div>

                        <div>
                            <label for="led_moderate_color">Moderate Weather</label>
                            <select id="led_moderate_color" name="led_moderate_color">
                                <option value="red" {% if settings[3] == 'red' %}selected{% endif %}>Red</option>
                                <option value="orange" {% if settings[3] == 'orange' %}selected{% endif %}>Orange</option>
                                <option value="yellow" {% if settings[3] == 'yellow' %}selected{% endif %}>Yellow</option>
                                <option value="green" {% if settings[3] == 'green' %}selected{% endif %}>Green</option>
                                <option value="blue" {% if settings[3] == 'blue' %}selected{% endif %}>Blue</option>
                                <option value="purple" {% if settings[3] == 'purple' %}selected{% endif %}>Purple</option>
                            </select>
                        </div>

                        <div>
                            <label for="led_cold_color">Cold Weather</label>
                            <select id="led_cold_color" name="led_cold_color">
                                <option value="red" {% if settings[4] == 'red' %}selected{% endif %}>Red</option>
                                <option value="orange" {% if settings[4] == 'orange' %}selected{% endif %}>Orange</option>
                                <option value="yellow" {% if settings[4] == 'yellow' %}selected{% endif %}>Yellow</option>
                                <option value="green" {% if settings[4] == 'green' %}selected{% endif %}>Green</option>
                                <option value="blue" {% if settings[4] == 'blue' %}selected{% endif %}>Blue</option>
                                <option value="purple" {% if settings[4] == 'purple' %}selected{% endif %}>Purple</option>
                            </select>
                        </div>

                        <div>
                            <label for="led_extreme_cold_color">Extreme Cold</label>
                            <select id="led_extreme_cold_color" name="led_extreme_cold_color">
                                <option value="red" {% if settings[5] == 'red' %}selected{% endif %}>Red</option>
                                <option value="orange" {% if settings[5] == 'orange' %}selected{% endif %}>Orange</option>
                                <option value="yellow" {% if settings[5] == 'yellow' %}selected{% endif %}>Yellow</option>
                                <option value="green" {% if settings[5] == 'green' %}selected{% endif %}>Green</option>
                                <option value="blue" {% if settings[5] == 'blue' %}selected{% endif %}>Blue</option>
                                <option value="purple" {% if settings[5] == 'purple' %}selected{% endif %}>Purple</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="section theme-section">
    <h2>Theme</h2>

    <label>Dashboard Theme</label>

    <div class="theme-options">
        <label class="theme-option">
            <input
                type="radio"
                name="theme"
                value="dark"
                {% if settings[6] == 'dark' %}checked{% endif %}
            >
            <span>Dark Mode</span>
        </label>

        <label class="theme-option">
            <input
                type="radio"
                name="theme"
                value="light"
                {% if settings[6] == 'light' %}checked{% endif %}
            >
            <span>Light Mode</span>
        </label>
    </div>
</div>

                <div class="button-row">
                    <button type="submit" class="save-btn">Save Settings</button>
                    <a href="/dashboard/{{ profile[0] }}" class="back-btn">Back to Dashboard</a>
                </div>
            </form>
        </div>
    </div>
{% include "virtual_keyboard.html" %}
</body>
</html>
