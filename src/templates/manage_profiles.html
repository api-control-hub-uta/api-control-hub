<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Profiles</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #141414;
            color: white;
            text-align: center;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            padding: 50px 20px;
        }

        h1 {
            font-size: 56px;
            margin: 0 0 15px;
        }

        .subtitle {
            color: #b3b3b3;
            font-size: 18px;
            margin-bottom: 40px;
        }

        .profiles {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 25px;
            flex-wrap: wrap;
        }

        .profile-card {
            position: relative;
            width: 170px;
            text-align: center;
        }

        .profile-click {
            cursor: pointer;
        }

        .profile-avatar {
            width: 120px;
            height: 120px;
            margin: 0 auto 15px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 46px;
            font-weight: bold;
            color: white;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        .profile-name {
            font-size: 24px;
            color: #d1d5db;
            overflow-wrap: anywhere;
        }

        .manage-icon {
            position: absolute;
            bottom: 10px;
            right: 10px;
            font-size: 28px;
            color: white;
        }

        .blue   { background: linear-gradient(135deg, #1e90ff, #6fb1ff); }
        .red    { background: linear-gradient(135deg, #ff0000, #ff5a5a); }
        .yellow { background: linear-gradient(135deg, #d4a200, #ffd95a); }
        .teal   { background: linear-gradient(135deg, #004d66, #5f8f9e); }
        .purple { background: linear-gradient(135deg, #7b2cbf, #c77dff); }

        .action-box {
            display: none;
            background: #1f1f1f;
            margin-top: 12px;
            padding: 12px;
            border-radius: 10px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
        }

        .action-box.show {
            display: block;
        }

        .action-box a,
        .action-box button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 44px;
            margin: 8px 0;
            padding: 10px;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            font-size: 15px;
            cursor: pointer;
            color: white;
        }

        .edit-btn {
            background: #4a90e2;
        }

        .remove-btn {
            background: #c0392b;
        }

        .lock-btn {
            background: #8e44ad;
        }

        .upload-btn {
            background: #16a085;
        }

        form {
            margin: 0;
        }

        .back-link {
            margin-top: 35px;
            padding-bottom: 20px;
        }

        .back-link a {
            color: #ccc;
            text-decoration: none;
            font-size: 18px;
        }

        .back-link a:hover {
            color: white;
        }

        /* Raspberry Pi 7-inch touchscreen: 800x480 */
        @media screen and (max-width: 850px) {
            body {
                min-height: 100vh;
                overflow-y: auto;
            }

            .container {
                min-height: 100vh;
                padding: 14px 12px 18px;
            }

            h1 {
                font-size: 34px;
                line-height: 1;
                margin-bottom: 5px;
            }

            .subtitle {
                font-size: 14px;
                margin-bottom: 14px;
            }

            .profiles {
                flex-wrap: nowrap;
                align-items: flex-start;
                gap: 10px;
                width: 100%;
            }

            .profile-card {
                width: calc((100% - 40px) / 5);
                min-width: 0;
            }

            .profile-avatar {
                width: 100%;
                max-width: 96px;
                aspect-ratio: 1 / 1;
                height: auto;
                margin-bottom: 7px;
                border-radius: 10px;
                font-size: 34px;
            }

            .profile-name {
                font-size: 14px;
                line-height: 1.05;
                min-height: 30px;
            }

            .manage-icon {
                right: 7px;
                bottom: 6px;
                font-size: 20px;
            }

            .back-link {
                margin-top: 14px;
                padding-bottom: 12px;
            }

            .back-link a {
                display: inline-flex;
                min-height: 44px;
                align-items: center;
                justify-content: center;
                padding: 8px 16px;
                border: 2px solid #666;
                border-radius: 8px;
                font-size: 15px;
            }

            .action-box {
                position: fixed;
                left: 50%;
                top: 50%;
                z-index: 1000;
                width: min(320px, calc(100vw - 32px));
                margin: 0;
                padding: 14px;
                transform: translate(-50%, -50%);
                border: 1px solid #444;
            }

            .action-box.show::before {
                content: "";
                position: fixed;
                inset: 0;
                z-index: -1;
                background: rgba(0, 0, 0, 0.72);
            }
        }

        @media screen and (max-width: 600px) {
            h1 {
                font-size: 30px;
            }

            .profiles {
                gap: 8px;
            }

            .profile-card {
                width: calc((100% - 32px) / 5);
            }

            .profile-name {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Manage Profiles</h1>
        <div class="subtitle">Choose a profile to manage</div>

        <div class="profiles">
            {% set colors = ['blue', 'red', 'yellow', 'teal', 'purple'] %}

            {% for profile in profiles %}
            <div class="profile-card">
                <div class="profile-click" onclick="toggleActions('actions-{{ profile[0] }}')">
                    <div class="profile-avatar {{ colors[loop.index0 % 5] }}">
                        {{ profile[1][0]|upper }}
                        <div class="manage-icon">✎</div>
                    </div>

                    <div class="profile-name">{{ profile[1] }}</div>
                </div>

                <div class="action-box" id="actions-{{ profile[0] }}">
                    <a class="edit-btn" href="/profiles/edit/{{ profile[0] }}">Edit</a>

                    <form method="post" action="/profiles/delete/{{ profile[0] }}">
                        <button class="remove-btn" type="submit">Remove</button>
                    </form>   
                </div>
            </div>
            {% endfor %}
        </div>

        <div class="back-link">
            <a href="/">← Back to Home</a>
        </div>
    </div>

    <script>
        function toggleActions(actionId) {
            const allBoxes = document.querySelectorAll(".action-box");

            allBoxes.forEach((box) => {
                if (box.id !== actionId) {
                    box.classList.remove("show");
                }
            });

            const selectedBox = document.getElementById(actionId);
            selectedBox.classList.toggle("show");
        }

        document.addEventListener("click", function (event) {
            const clickedProfile = event.target.closest(".profile-click");
            const clickedActionBox = event.target.closest(".action-box");

            if (!clickedProfile && !clickedActionBox) {
                document.querySelectorAll(".action-box").forEach((box) => {
                    box.classList.remove("show");
                });
            }
        });
    </script>
{% include "virtual_keyboard.html" %}    
</body>
</html>
